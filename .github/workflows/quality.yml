name: Quality Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify PWA entry points
        run: |
          test -s index.html
          test -s manifest.webmanifest
          test -s sw.js
          test -s icon.svg
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
      - name: Extract and syntax-check game JavaScript
        run: |
          node -e "const h=require('fs').readFileSync('index.html','utf8'); const m=h.match(/<script>\\s*([\\s\\S]*?)<\\/script>/); if(!m) throw new Error('Game script not found'); require('fs').writeFileSync('/tmp/game.js',m[1]);"
          node --check /tmp/game.js
      - name: Check document references
        run: |
          grep -q 'manifest.webmanifest' index.html
          grep -q 'serviceWorker' index.html
